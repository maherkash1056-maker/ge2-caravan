<script>/* GE2 Caravan bridge — lets a student-made game use the class server:

          const q = await Caravan.questions({skills:["r_tfng","r_abc"], n:15, topic:"two sisters in Salalah and Muscat"});

(function(){

  function parseSetup(){ const h=location.hash.replace(/^#/,""); let x=""; h.split("&").forEach(seg=>{ if(seg.indexOf("x=")===0) x=seg.slice(2); }); if(!x) return null; const a=x.split("."); const src=a[0]||"claude"; if(src==="claude"&&!(+a[1])) return null; return { src, len:+a[1]||0, title:decodeURIComponent(a.slice(2).join(".")||"") }; }

      "", "SOURCE", 'Write the text yourself about this topic: "'+(o.topic||"daily life in Oman")+'". Use true, well-known facts or a gentle realistic story; no invented statistics.',

      "", "QUESTIONS: exactly "+(o.n||15)+" questions, "+(o.mix?Object.keys(o.mix).map(k=>o.mix[k]+" of type "+k.replace(/^r_/,"")).join(" and ")+", in that order:":"shared as evenly as possible between these types:"), ...types,

    const j=res.j||{}; if(!j.ok){ const code=j.code||"error"; throw { code, msg: j.error || (code==="limit"?"You have made today's 12 exams. Come back tomorrow.":"Claude did not answer. Try again.") }; }
    return normalise(j.text); }
  function report(r){ if(!C.session||!r||!r.total) return; r=Object.assign({},r); const sc=reader.scan; if(sc&&sc.n&&!r.noScan){ r.right=(r.right||0)+sc.r; r.total=(r.total||0)+sc.n; r.skills=(r.skills||[]).concat([{id:"r_scan",name:"Scanning for facts",r:sc.r,n:sc.n}]); if(typeof r.score==="number") r.score+=sc.r*10; reader.scan=null; } const sk=(r.skills||[]).filter(x=>x.n>0).map(x=>({id:x.id,name:x.name||SKILL_NAMES[x.id]||x.id,r:x.r,n:x.n}));

  function badge(){ const d=document.createElement("div"); d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:50;display:flex;gap:10px;align-items:center;padding:6px max(12px,env(safe-area-inset-left)) 6px max(12px,env(safe-area-inset-right));background:#24170f;color:#fffaf0;font:600 14px/1.3 'Trebuchet MS',system-ui,sans-serif";
    const s=C.session; d.innerHTML='<span style="color:#e0b046">🐫 GE2 Caravan</span><span>'+C.game+(C.makerName?' · made by <b>'+C.makerName+'</b>':'')+'</span><span style="margin-left:auto">'+(s?(s.short||s.name||s.id):'<a href="https://maherkash.app.n8n.cloud/webhook/ge2-studio-app#exam" style="color:#e0b046">Log in on the Caravan page</a>')+'</span>'; document.body.appendChild(d); document.body.style.paddingTop="36px"; return d; }
  // ---------- reading helper: full text first, tap-to-highlight, text stays beside every question ----------

  const reader = { paras:[], hl:new Set(), need:3, _css:false,
    css(){ if(this._css) return; this._css=true; const st=document.createElement("style"); st.textContent=".cv-w{border-radius:3px;padding:0 1px;cursor:pointer}.cv-w.hl{background:#ffe066;box-shadow:0 0 0 1px #e0b046;color:#24170f}.cv-w.no{background:#f8c8c0;text-decoration:line-through}.cv-refuse{display:none;position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10000;background:#24170f;color:#fffaf0;padding:10px 14px;border-radius:12px;font:15px 'Alegreya Sans',system-ui,sans-serif;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}.cv-ovl .cv-q{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.cv-ovl .cv-q button{background:#3f7e7a}.cv-text{max-height:30vh;overflow:auto;background:#fffaf0;border:2px solid #d8c39c;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:15px;line-height:1.5;text-align:left;color:#24170f;-webkit-overflow-scrolling:touch}.cv-text p{margin:0 0 .6em}.cv-text .cv-pl{display:inline-block;background:#24170f;color:#fffaf0;border-radius:6px;padding:0 6px;margin-right:6px;font-weight:800;font-size:13px}.cv-note{font-size:13px;color:#6b5541;margin:0 0 4px}.cv-ovl{position:fixed;inset:0;z-index:9999;background:#f3e8cf;color:#24170f;display:flex;flex-direction:column;font-family:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.cv-ovl h2{margin:0 0 4px;font-size:22px}.cv-ovl .cv-text{flex:1;max-height:none;font-size:17px}.cv-ovl .cv-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:8px;flex-wrap:wrap}.cv-ovl .cv-count{font-weight:800;font-size:18px}.cv-ovl button{font:inherit;font-weight:800;font-size:18px;padding:12px 22px;border-radius:12px;border:2px solid #24170f;background:#b7432d;color:#fff;cursor:pointer}.cv-ovl button:disabled{background:#d8c39c;color:#6b5541;border-color:#d8c39c}@media (min     setText(paras){ paras=(paras||[]).map(String).filter(Boolean); const same=JSON.stringify(paras)===JSON.stringify(this.paras); this.paras=paras; if(!same) this.hl=new Set(); this.need=this.needFor(); return this; },

      if(items.length){ const it=pick(items); const letters=[...new Set(this.paras.map((p,i)=>{ const m=String(p).match(/^\[([A-H])\]/); return m?m[1]:String(i+1); }))]; if(letters.length>=2) qs.push({q:'In which paragraph did you highlight “'+it.word+'”?',opts:letters,a:it.letter}); }
      if(items.length){ const it=pick(items); const pool=[]; this.paras.forEach((p,pi)=>{ const m=String(p).match(/^\[([A-H])\]\s*/); const words=(m?p.slice(m[0].length):p).split(/\s+/); words.forEach((w,wi)=>{ const kd=this.kind(w,wi?words[wi-1]:"",wi===0); const c=String(w).replace(/^[("'“‘]+|[)"'”’,.;:!?]+$/g,""); if(kd&&!this.hl.has(pi+":"+wi)&&c!==it.word) pool.push(c); }); }); const dd=shuffle([...new Set(pool)]).slice(0,3); if(dd.length===3) qs.push({q:"Which of these did you highlight?",opts:shuffle([it.word].concat(dd)),a:it.word}); }
      if(items.length){ const it=pick(items); const names={number:"a number, time or date",name:"a name or a place",date:"a date or time word",reason:"a reason (cause / effect)"}; qs.push({q:'What kind of information is “'+it.word+'”?',opts:Object.values(names),a:names[it.kind]}); }
      this.scan={r:0,n:qs.length}; if(!qs.length) return Promise.resolve(); let i=0; const self=this;
      return new Promise(res=>{ const show=()=>{ const q=qs[i]; d.innerHTML='<h2>🔎 Your highlights — question '+(i+1)+' of '+qs.length+'</h2><p class="cv-note">About the facts you highlighted. Each right answer counts in your score.</p><p style="font-size:20px;font-weight:800;margin:8px 0">'+esc(q.q)+'</p><div class="cv-q">'+q.opts.map(o=>'<button type="button" data-hq="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div><p class="cv-note" style="min-height:22px;font-size:16px"></p>';
        const msg=d.querySelector("p:last-child"); d.querySelectorAll("[data-hq]").forEach(b=>b.onclick=()=>{ const ok=b.dataset.hq===q.a; if(ok) self.scan.r++; msg.textContent=ok?"✅ Correct!":"❌ The answer was "+q.a+"."; d.querySelectorAll("[data-hq]").forEach(x=>x.disabled=true); setTimeout(()=>{ i++; if(i<qs.length) show(); else res(); },900); }); }; show(); }); }
  };
  function fullscreen(){ try{ const el=document.documentElement; const r=el.requestFullscreen?el.requestFullscreen({navigationUI:"hide"}):el.webkitRequestFullscreen?el.webkitRequestFullscreen():null; if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
  window.Caravan = { init, student, questions, report, badge, SKILL_NAMES, reader, fullscreen };
})();
</script>
<script>const GAME="Khareef Rally";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SESS=Caravan.init({game:GAME});Caravan.badge();
const ST={right:0,total:0,skills:{}};let EX=null,QI=0;
const normA=s=>String(s||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function tally(q,ok){ST.total++;if(ok)ST.right++;const k=q.skill||"r_abc";ST.skills[k]=ST.skills[k]||{id:k,r:0,n:0};ST.skills[k].n++;if(ok)ST.skills[k].r++;}
function isRight(q,v){return q.type==="word"?String(q.a).split(/\s*\/\s*/).some(a=>normA(a)===normA(v)):+v===q.a;}
function rightText(q){return q.type==="word"?q.a:q.o[q.a];}
function nextQ(){return EX&&QI<EX.questions.length?EX.questions[QI++]:null;}
function qLeft(){return EX?EX.questions.length-QI:0;}
/* one question in a card, with the text beside it; resolves true/false */
function askQ(q,o){o=o||{};return new Promise(res=>{const d=document.createElement("div");d.className="qov";let done=false,tm=null;
  const typ=q.type==="tfng"?"True / False / Not Given":q.type==="abc"?"Choose A, B or C":"Write ONE word or a number from the text";
  d.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><span class="lab">'+esc(o.label||"Question")+'</span><span class="hint">'+typ+(o.hint?" · "+esc(o.hint):"")+'</span></div>'+(o.seconds?'<div class="timer"><i></i></div>':'')+'<p class="q">'+esc(q.q).replace(/_{2,}/g,"______")+'</p><div class="ans">'+(q.type==="word"?'<div class="row" style="flex-wrap:nowrap"><input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button class="btn t" data-go>Check</button></div>':q.o.map((x,i)=>'<button class="opt" data-v="'+i+'"><b>'+(q.type==="tfng"?"TFN"[i]:"ABC"[i])+'</b><span>'+esc(x)+'</span></button>').join(""))+'</div><div class="fbx"></div>'+Caravan.reader.box("The text — find the answer here (tap to highlight)")+'</div>';
  document.body.appendChild(d);Caravan.reader.bind(d.querySelector(".cv-text"));
  const finish=(v,late)=>{if(done)return;done=true;clearInterval(tm);const ok=!late&&isRight(q,v);tally(q,ok);d.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.v===q.a)b.classList.add("ok");else if(+b.dataset.v===+v)b.classList.add("no");});const inp=d.querySelector("input");if(inp)inp.disabled=true;const g=d.querySelector("[data-go]");if(g)g.disabled=true;
    d.querySelector(".fbx").innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ Correct! ":late?"⏰ Too late. ":"❌ Not this time. ")+(ok?"":"The answer is <b>"+esc(rightText(q))+"</b>. ")+esc(q.why||"")+'</div><button class="btn p w" data-next>Continue ▶</button>';
    d.querySelector("[data-next]").onclick=()=>{d.remove();res(ok);};d.querySelector(".card").scrollTop=0;};
  d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>finish(b.dataset.v));const inp=d.querySelector("input");if(inp){const go=()=>{if(inp.value.trim())finish(inp.value);};d.querySelector("[data-go]").onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});}
  if(o.seconds){const t0=Date.now(),bar=d.querySelector(".timer i");tm=setInterval(()=>{const l=Math.max(0,1-(Date.now()-t0)/(o.seconds*1000));bar.style.width=(l*100)+"%";if(l<=0)finish(null,true);},200);}});}
function note(html,btn){return new Promise(res=>{const d=document.createElement("div");d.className="qov";d.innerHTML='<div class="card">'+html+'<button class="btn p w" style="margin-top:10px">'+(btn||"Continue ▶")+'</button></div>';document.body.appendChild(d);d.querySelector("button.btn.p.w").onclick=()=>{d.remove();res();};});}
async function loadExam(opts,readTitle){const app=$("#app");if(!SESS){app.innerHTML='<div class="card"><h1>'+esc(GAME)+'</h1><p class="err">Log in on the GE2 Caravan page first, then open this game from the Play tab.</p></div>';throw 0;}
  app.innerHTML='<div class="card"><h1>'+esc(GAME)+'</h1><p class="big">✍️ Claude is writing your text and questions…</p><p class="hint" style="text-align:center">About 30–60 seconds. A new text every time.</p></div>';
  try{EX=await Caravan.questions(opts);}catch(e){app.innerHTML='<div class="card"><h1>'+esc(GAME)+'</h1><p class="err">'+esc((e&&e.msg)||"Claude did not answer. Try again.")+'</p><button class="btn p" onclick="location.reload()">Try again</button></div>';throw e;}
  if(EX.bank){const want=new Set((opts.skills||[]).map(k=>k.replace(/^r_/,"")));EX.questions=EX.questions.filter(q=>want.has(q.type));if(opts.n&&EX.questions.length>opts.n)EX.questions=EX.questions.slice(0,opts.n);}
  if(!EX.questions.length){app.innerHTML='<div class="card"><p class="err">The questions did not pass the answer check. Try again.</p><button class="btn p" onclick="location.reload()">Try again</button></div>';throw 0;}
  QI=0;Caravan.reader.setText(EX.paragraphs);await Caravan.reader.readFirst({title:readTitle||"Read the text first",button:"Start ▶"});}
function finishGame(title,lines,won,badges){Caravan.report({right:ST.right,total:ST.total,skills:Object.values(ST.skills),won:!!won,badges:badges||[]});
  $("#app").innerHTML='<div class="card" style="text-align:center"><p class="big">'+title+'</p>'+lines.map(l=>'<p style="margin:4px 0">'+l+'</p>').join("")+'<p style="margin:8px 0"><b>'+ST.right+' / '+ST.total+'</b> questions right. Your result and XP are saved.</p><div class="row" style="justify-content:center"><button class="btn p" onclick="location.reload()">Play again</button></div><p class="hint">Close this tab to go back to the Caravan.</p></div>';}
document.addEventListener("click",function(e){if(e.target.closest("button")&&!document.fullscreenElement&&!window._fs){window._fs=true;Caravan.fullscreen();}},true);

/* Khareef Rally — drive across Dhofar, find the five lost caravan stones. Checkpoint questions give fuel. */
const TOWNS=[{n:"Salalah",x:150,y:430,e:"🕌",f:"Salalah is the capital of Dhofar and the centre of the khareef festival."},{n:"Taqah",x:390,y:405,e:"🏰",f:"Taqah has an old castle and a long fishing beach."},{n:"Mirbat",x:650,y:445,e:"⚓",f:"Mirbat was a famous port for frankincense and horses."},{n:"Wadi Darbat",x:470,y:235,e:"💧",f:"Wadi Darbat has waterfalls and a green lake in the khareef."},{n:"Jabal Samhan",x:800,y:170,e:"⛰️",f:"Jabal Samhan is a high mountain where the Arabian leopard lives."}];
const ROADS=[[0,1],[1,2],[1,3],[3,4],[2,4]],FOG=[{x:430,y:320,r:70},{x:640,y:300,r:80},{x:730,y:240,r:60}];
const R={x:60,y:445,a:0,fuel:70,score:0,stones:0,tx:null,ty:null,last:0,busy:false,lastTown:null,raf:0,WW:1000,WH:560,over:false};
function menu(){$("#app").innerHTML='<div class="card"><h1>🚙 Khareef Rally</h1><p class="sub">Five caravan stones are lost in Dhofar: in Salalah, Taqah, Mirbat, Wadi Darbat and on Jabal Samhan. Drive your old pickup to each place — touch the map where you want to go. At every town you answer checkpoint questions: correct answers fill your tank. Fog slows you down, and the roads are faster than the sand.</p><button class="btn p" id="go">Start the engine ▶</button><p class="hint">Claude writes a new text every time (this uses 1 of your 12 exams today).</p></div>';$("#go").onclick=start;}
async function start(){try{await loadExam({skills:["r_abc","r_word"],n:15,topic:"a road trip across Dhofar in the khareef: Salalah, Taqah, Mirbat, Wadi Darbat and Jabal Samhan",words:"320-420"},"Your road book — read it before you drive");}catch(e){return;}
  $("#app").innerHTML='<div class="rwrap"><div class="rhud row"><span>⛽</span><div class="bar"><i id="rf"></i></div><span>🪨 <b id="rs">0</b>/5</span><span>⭐ <b id="rp">0</b></span></div><canvas id="rcv"></canvas><p class="hint" id="rt" style="margin:4px 0;text-align:center">Touch the map to drive. Go to a town to find its stone.</p></div>';
  size();addEventListener("resize",size);const cv=$("#rcv");const aim=e=>{const b=cv.getBoundingClientRect();R.tx=(e.clientX-b.left)/R.k;R.ty=(e.clientY-b.top)/R.k;};cv.addEventListener("pointerdown",e=>{aim(e);cv.setPointerCapture(e.pointerId);});cv.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")aim(e);});
  R.last=performance.now();hud();R.raf=requestAnimationFrame(loop);}
let cx;function size(){const cv=$("#rcv");if(!cv)return;const w=cv.parentElement.clientWidth,h=Math.max(220,innerHeight-130);R.k=Math.min(w/R.WW,h/R.WH);cv.style.width=(R.WW*R.k)+"px";cv.style.height=(R.WH*R.k)+"px";const r=Math.min(2,devicePixelRatio||1);cv.width=R.WW*R.k*r;cv.height=R.WH*R.k*r;cx=cv.getContext("2d");cx.setTransform(R.k*r,0,0,R.k*r,0,0);}
function hud(){$("#rf").style.width=Math.max(0,R.fuel)+"%";$("#rf").style.background=R.fuel>40?"#2f6f69":R.fuel>20?"#e0b046":"#b7432d";$("#rs").textContent=R.stones;$("#rp").textContent=R.score;}
function dSeg(px,py,a,b){const vx=b.x-a.x,vy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy)));return Math.hypot(px-a.x-vx*t,py-a.y-vy*t);}
function onRoad(){if(dSeg(R.x,R.y,{x:40,y:445},TOWNS[0])<26)return true;return ROADS.some(r=>dSeg(R.x,R.y,TOWNS[r[0]],TOWNS[r[1]])<26);}
function loop(now){R.raf=requestAnimationFrame(loop);const dt=Math.min(.1,(now-R.last)/1000);R.last=now;
  if(!R.busy&&R.tx!=null){const dx=R.tx-R.x,dy=R.ty-R.y,d=Math.hypot(dx,dy);if(d>6){const fog=FOG.some(f=>Math.hypot(R.x-f.x,R.y-f.y)<f.r);const sp=(onRoad()?150:85)*(fog?0.55:1);R.a=Math.atan2(dy,dx);R.x+=dx/d*sp*dt;R.y+=dy/d*sp*dt;R.x=Math.max(20,Math.min(R.WW-20,R.x));R.y=Math.max(40,Math.min(482,R.y));R.fuel-=2.1*dt;hud();
      if(R.fuel<=0){R.busy=true;R.tx=null;R.score=Math.max(0,R.score-50);const t=R.lastTown||{x:60,y:445,n:"the start"};note('<p class="big">⛽ Out of fuel!</p><p style="text-align:center">A camel tows your pickup back to '+esc(t.n)+'. −50 points. A kind farmer gives you some petrol.</p>').then(()=>{R.x=t.x;R.y=t.y+30;R.fuel=35;R.busy=false;hud();});}}}
  if(!R.busy){const t=TOWNS.find(t=>!t.done&&Math.hypot(R.x-t.x,R.y-t.y)<34);if(t)checkpoint(t);}
  draw(now);}
async function checkpoint(t){R.busy=true;R.tx=null;let got=0,asked=0;await note('<p class="big">'+t.e+' '+esc(t.n)+' checkpoint</p><p style="text-align:center">'+esc(t.f)+'</p><p style="text-align:center">Answer the checkpoint questions. Every correct answer = fuel.</p>',"Stop the car ▶");
  const left=TOWNS.filter(x=>!x.done).length;const n=Math.max(1,Math.min(3,Math.floor(qLeft()/left)||(qLeft()?1:0)));
  for(let i=0;i<n;i++){const q=nextQ();if(!q)break;asked++;const ok=await askQ(q,{label:t.e+" "+t.n+" · question "+(i+1)+" of "+n});if(ok){got++;R.fuel=Math.min(100,R.fuel+22);R.score+=100;}else R.fuel=Math.max(5,R.fuel-6);hud();}
  t.done=true;R.stones++;R.lastTown=t;R.score+=50;hud();
  if(R.stones>=TOWNS.length){cancelAnimationFrame(R.raf);finishGame("🪨 Road of Frankincense — all five stones found!",["Score: "+R.score+" · Fuel left: "+Math.round(R.fuel)+"%","Badges: Stone Finder + Road of Frankincense"],true,["stone_finder","road_frankincense"]);return;}
  await note('<p class="big">🪨 Stone '+R.stones+' of 5 found!</p><p style="text-align:center">'+got+' of '+asked+' correct at '+esc(t.n)+'. Tank: '+Math.round(R.fuel)+'%. Drive on!</p>',"Back to the road ▶");R.busy=false;$("#rt").textContent=(5-R.stones)+" stones to find. Roads are faster than sand; fog is slow.";}
function draw(now){if(!cx)return;const g=cx.createLinearGradient(0,0,0,500);g.addColorStop(0,"#b9d7a8");g.addColorStop(.5,"#d9e3a8");g.addColorStop(1,"#ecdcae");cx.fillStyle=g;cx.fillRect(0,0,R.WW,500);cx.fillStyle="#3f8f9f";cx.fillRect(0,500,R.WW,60);cx.fillStyle="rgba(255,255,255,.4)";for(let i=0;i<8;i++)cx.fillRect(((now/30)+i*140)%R.WW,515+(i%3)*14,50,2);
  cx.font="34px serif";cx.textAlign="center";[[250,120],[340,90],[560,110],[680,80],[900,90],[120,200],[880,300]].forEach(m=>cx.fillText("⛰️",m[0],m[1]));cx.font="22px serif";[[300,300],[560,360],[220,330],[760,400],[520,160]].forEach(m=>cx.fillText("🌴",m[0],m[1]));
  cx.lineCap="round";cx.strokeStyle="#8a7a5c";cx.lineWidth=20;const seg=(a,b)=>{cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();};seg({x:40,y:445},TOWNS[0]);ROADS.forEach(r=>seg(TOWNS[r[0]],TOWNS[r[1]]));cx.strokeStyle="#f4e9c9";cx.lineWidth=2;cx.setLineDash([12,12]);seg({x:40,y:445},TOWNS[0]);ROADS.forEach(r=>seg(TOWNS[r[0]],TOWNS[r[1]]));cx.setLineDash([]);
  for(const t of TOWNS){cx.fillStyle=t.done?"#cfe3df":"#fffaf0";cx.strokeStyle=t.done?"#2f6f69":"#b7432d";cx.lineWidth=4;cx.beginPath();cx.arc(t.x,t.y,26,0,7);cx.fill();cx.stroke();cx.font="26px serif";cx.fillText(t.done?"✅":t.e,t.x,t.y+9);cx.font="bold 17px sans-serif";cx.fillStyle="#24170f";cx.fillText(t.n,t.x,t.y-34);if(!t.done){cx.font="18px serif";cx.fillText("🪨",t.x+26,t.y-18+Math.sin(now/250)*3);}}
  for(const f of FOG){const gr=cx.createRadialGradient(f.x,f.y,10,f.x,f.y,f.r);gr.addColorStop(0,"rgba(255,255,255,.85)");gr.addColorStop(1,"rgba(255,255,255,0)");cx.fillStyle=gr;cx.beginPath();cx.arc(f.x+Math.sin(now/1500+f.r)*8,f.y,f.r,0,7);cx.fill();}
  if(R.tx!=null&&!R.busy){cx.strokeStyle="rgba(183,67,45,.7)";cx.lineWidth=3;cx.beginPath();cx.arc(R.tx,R.ty,10,0,7);cx.stroke();}
  cx.save();cx.translate(R.x,R.y);cx.rotate(R.a);cx.fillStyle="#24170f";cx.fillRect(-16,-11,8,5);cx.fillRect(-16,6,8,5);cx.fillRect(8,-11,8,5);cx.fillRect(8,6,8,5);cx.fillStyle="#b7432d";cx.fillRect(-20,-9,40,18);cx.fillStyle="#f4e9c9";cx.fillRect(2,-7,10,14);cx.fillStyle="#7a2416";cx.fillRect(-18,-7,16,14);cx.restore();}
menu();
</script></body></html>
