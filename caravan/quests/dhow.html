<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dhow to Zanzibar · GE2 Caravan</title><style>:root{--bg:#f3e8cf;--card:#fffaf0;--ink:#24170f;--muted:#6b5541;--line:#d8c39c;--red:#b7432d;--gold:#e0b046;--teal:#2f6f69;color-scheme:light}

<script>/* GE2 Caravan bridge — lets a student-made game use the class server:
   login from the page address (#…&s=TOKEN~ID~ROLE~NAME~SHORT), Claude-written questions, results → XP.
   Usage: Caravan.init({game:"Two Windows", maker:"430S2656", makerName:"Ajnan"});
          const q = await Caravan.questions({skills:["r_tfng","r_abc"], n:15, topic:"two sisters in Salalah and Muscat"});
          Caravan.report({right, total, skills:[{id,name,r,n}], won:true}); */
(function(){
  const HOOK = (window.CARAVAN_HOOK || "https://ge2-caravan-api.ge2-caravan.workers.dev/");
  const SKILL_NAMES = { r_tfng:"True / False / Not Given", r_abc:"A, B or C questions", r_word:"One word or a number", r_head:"Main ideas: headings", r_box:"Word box gaps", r_table:"Completing a table or notes", g_passive:"The passive", g_modal:"Modals", v_syn:"Synonyms and antonyms" };
  const C = { game:"Class game", maker:"", makerName:"", session:null, store:{} };
  function parseSetup(){ const h=location.hash.replace(/^#/,""); let x=""; h.split("&").forEach(seg=>{ if(seg.indexOf("x=")===0) x=seg.slice(2); }); if(!x) return null; const a=x.split("."); const src=a[0]||"claude"; if(src==="claude"&&!(+a[1])) return null; return { src, len:+a[1]||0, title:decodeURIComponent(a.slice(2).join(".")||"") }; }
  function parseHash(){ const h=location.hash.replace(/^#/,""); let s=""; h.split("&").forEach(seg=>{ if(seg.indexOf("s=")===0) s=seg.slice(2); }); if(!s) return null; const a=s.split("~"); if(a.length<2||a[0].length<8) return null; return { token:a[0], id:a[1], role:a[2]||"student", name:decodeURIComponent(a[3]||""), short:decodeURIComponent(a[4]||"") }; }
  async function post(payload){ const r = await fetch(HOOK, { method:"POST", headers:{ "content-type":"text/plain;charset=UTF-8" }, body: JSON.stringify(payload) }); let j=null; try{ j=await r.json(); }catch(e){} return { ok:r.ok, j }; }
  function init(o){ Object.assign(C, o||{}); C.session = parseHash(); return C.session; }
  function student(){ return C.session; }
  function prompt(o){ const sk=(o.skills||["r_tfng","r_abc"]); const types=[]; if(sk.includes("r_tfng")) types.push('- "tfng": a statement that paraphrases the text; "answer" is "True", "False" or "Not Given"; use all three. ("skill":"r_tfng")'); if(sk.includes("r_abc")) types.push('- "abc": a detail question with 3 "options", only one correct; "answer" is "A", "B" or "C". ("skill":"r_abc")'); if(sk.includes("r_word")) types.push('- "word": a sentence from the text with ONE word missing, written as "q" with ____ ; "answer" is that exact word from the text. ("skill":"r_word")');
    return ["Write a practice exam for students of General English 2 (GE2, CEFR B1) at the University of Technology and Applied Sciences in Salalah, Oman. The students are Arabic speakers aged 18 to 21. They answer inside an English learning game called \""+C.game+"\" made by their classmate; one question at a time, with the text shown beside each question.",
      "", "SOURCE", 'Write the text yourself about this topic: "'+(o.topic||"daily life in Oman")+'". Use true, well-known facts or a gentle realistic story; no invented statistics.',
      "", "TEXT: one reading text (\"kind\":\"read\"), "+(o.words||"220-320")+" words, 3 or 4 paragraphs each starting with [A], [B], … B1 level: clear sentences of 10-20 words. Suitable for a university in Oman: modest and respectful, no romance, no alcohol, no politics.",
      "", "QUESTIONS: exactly "+(o.n||15)+" questions, "+(o.mix?Object.keys(o.mix).map(k=>o.mix[k]+" of type "+k.replace(/^r_/,"")).join(" and ")+", in that order:":"shared as evenly as possible between these types:"), ...types,
      "Every answer must be provable from the text; put the exact words that prove it in \"evidence\" (\"\" for Not Given). \"why\": one short simple sentence shown after the student answers. Exactly one answer is correct; wrong options must be possible but clearly wrong for a careful reader. Do not test the same fact twice.",
      "", "OUTPUT: reply with ONLY one JSON object: {\"title\":\"2-5 words\",\"texts\":[{\"title\":\"…\",\"kind\":\"read\",\"body\":\"[A] …\\n\\n[B] …\"}],\"questions\":[{\"type\":\"tfng\",\"text\":0,\"q\":\"…\",\"answer\":\"True\",\"evidence\":\"…\",\"why\":\"…\",\"skill\":\"r_tfng\"},{\"type\":\"abc\",\"text\":0,\"q\":\"…\",\"options\":[\"…\",\"…\",\"…\"],\"answer\":\"B\",\"evidence\":\"…\",\"why\":\"…\",\"skill\":\"r_abc\"}]}"].join("\n"); }
  function normalise(raw){ let j=raw; if(typeof j==="string"){ const m=j.match(/\{[\s\S]*\}/); j=JSON.parse(m?m[0]:j); } const reads=(j.texts||[]).filter(t=>t&&t.kind!=="listen"&&t.body); const text=reads.map((t,i)=>(reads.length>1&&t.title?"["+(i+1)+"] "+t.title+"\n\n":"")+t.body).join("\n\n")||((j.texts&&j.texts[0]&&j.texts[0].body)||""); const out=[]; for(let q of (j.questions||[])){ if(q&&(q.type==="table"||q.type==="box")&&q.answer){ q=Object.assign({},q,{type:"word"}); } if(q.type==="tfng"){ const a=String(q.answer||"").toLowerCase(); const i=a.startsWith("t")?0:a.startsWith("f")?1:2; out.push({type:"tfng",q:q.q,o:["True","False","Not Given"],a:i,why:q.why||"",skill:"r_tfng",ev:String(q.evidence||"")}); } else if(q.type==="abc"&&Array.isArray(q.options)&&q.options.length===3){ const a=String(q.answer||"A").trim().toUpperCase().charCodeAt(0)-65; out.push({type:"abc",q:q.q,o:q.options,a:Math.min(2,Math.max(0,a)),why:q.why||"",skill:"r_abc",ev:String(q.evidence||"")}); } else if(q.type==="word"){ out.push({type:"word",q:q.q,a:String(q.answer||"").trim().toLowerCase(),why:q.why||"",skill:"r_word",ev:String(q.evidence||"")}); } }
    // evidence check: the proof must appear in the text (Not Given excepted)
    const ok=out.filter((q,i)=>{ const src=(j.questions||[])[i]; if(!src) return false; if(q.type==="tfng"&&q.a===2) return true; const ev=String(src.evidence||"").toLowerCase().replace(/\s+/g," ").trim(); return ev.length<4 || text.toLowerCase().replace(/\s+/g," ").includes(ev); });
    const paras=text.split(/\n\s*\n/).filter(Boolean); const low=x=>String(x).toLowerCase().replace(/\s+/g," ").trim(); ok.forEach(q=>{ const e=low(q.ev); q.p=""; if(e.length>=4){ const k=paras.findIndex(p=>low(p).includes(e)); if(k>=0) q.p=(paras[k].match(/^\[([A-H])\]/)||[])[1]||String.fromCharCode(65+k); } });
    return { title:j.title||"", text, paragraphs:paras, questions:ok }; }
  async function questions(o){ o=o||{}; if(!C.session) throw { code:"login", msg:"Please log in on the GE2 Caravan page first, then open this game from the Play tab." };
    const su=parseSetup(); C.setup=su;
    if(su&&(su.src==="bank"||su.src==="mine")){ const data=su.src==="mine"?{ title:su.title }:{ skills:su.len>=25?[]:(o.skills||["r_tfng","r_abc"]), len:su.len===26?25:su.len===50?50:su.len||o.n||15 }; if(su.src==="bank"&&su.len===26) data.listening=true;
      const res=await post({ kind:"bank", token:C.session.token, data }); const j=res.j||{}; if(!j.ok||!j.spec) throw { code:j.code||"empty", msg:j.error||"No exam found in the bank. Choose 'Fresh from Claude' on the Caravan page." };
      const n=normalise(j.spec); n.title=(j.title||n.title)+(j.by?" · by "+j.by:""); n.bank=true; const want=new Set((o.skills||["r_tfng","r_abc"]).map(k=>k.replace(/^r_/,""))); n.questions=n.questions.filter(q=>want.has(q.type)); const cap=su.len>=25?25:(su.len||o.n||15); if(n.questions.length>cap) n.questions=n.questions.slice(0,cap); if(!n.questions.length) throw { code:"empty", msg:"That exam has no questions this game can use (it needs True/False/Not Given, A/B/C or one-word questions)." }; return n; }
    if(su&&su.src==="claude"&&su.len) o.n=su.len;
    const res=await post({ kind:"exam", token:C.session.token, student:C.session.name, device:"GAME", prompt:prompt(o), images:[], fast:false, skills:o.skills||["r_tfng","r_abc"], len:o.n||15, style:true, awl:true, game:C.game });
    const j=res.j||{}; if(!j.ok){ const code=j.code||"error"; throw { code, msg: j.error || (code==="limit"?"You have made today's 12 exams. Come back tomorrow.":"Claude did not answer. Try again.") }; }
    return normalise(j.text); }
  function report(r){ if(!C.session||!r||!r.total) return; r=Object.assign({},r); const sc=reader.scan; if(sc&&sc.n&&!r.noScan){ r.right=(r.right||0)+sc.r; r.total=(r.total||0)+sc.n; r.skills=(r.skills||[]).concat([{id:"r_scan",name:"Scanning for facts",r:sc.r,n:sc.n}]); if(typeof r.score==="number") r.score+=sc.r*10; reader.scan=null; } const sk=(r.skills||[]).filter(x=>x.n>0).map(x=>({id:x.id,name:x.name||SKILL_NAMES[x.id]||x.id,r:x.r,n:x.n}));
    const weakest=(sk.filter(x=>x.r<x.n).sort((a,b)=>a.r/a.n-b.r/b.n)[0]||{}).name||""; const pct=Math.round(100*r.right/r.total); const grade=pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"F";
    post({ kind:"result", token:C.session.token, student:C.session.name, device:"GAME", type:"Class game", exam:String(C.game).slice(0,80), maker:C.maker, right:r.right, total:r.total, grade, score:r.score||0, won:!!r.won, skills:sk, weakest, badges:(r.badges||[]).slice(0,6) }).catch(()=>{}); }
  function badge(){ const d=document.createElement("div"); d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:50;display:flex;gap:10px;align-items:center;padding:6px max(12px,env(safe-area-inset-left)) 6px max(12px,env(safe-area-inset-right));background:#24170f;color:#fffaf0;font:600 14px/1.3 'Trebuchet MS',system-ui,sans-serif";
    const s=C.session; d.innerHTML='<span style="color:#e0b046">🐫 GE2 Caravan</span><span>'+C.game+(C.makerName?' · made by <b>'+C.makerName+'</b>':'')+'</span><span style="margin-left:auto">'+(s?(s.short||s.name||s.id):'<a href="https://maherkash.app.n8n.cloud/webhook/ge2-studio-app#exam" style="color:#e0b046">Log in on the Caravan page</a>')+'</span>'; document.body.appendChild(d); document.body.style.paddingTop="36px"; return d; }
  // ---------- reading helper: full text first, tap-to-highlight, text stays beside every question ----------
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const reader = { paras:[], hl:new Set(), need:3, _css:false,
    css(){ if(this._css) return; this._css=true; const st=document.createElement("style"); st.textContent=".cv-w{border-radius:3px;padding:0 1px;cursor:pointer}.cv-w.hl{background:#ffe066;box-shadow:0 0 0 1px #e0b046;color:#24170f}.cv-w.no{background:#f8c8c0;text-decoration:line-through}.cv-refuse{display:none;position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10000;background:#24170f;color:#fffaf0;padding:10px 14px;border-radius:12px;font:15px 'Alegreya Sans',system-ui,sans-serif;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}.cv-ovl .cv-q{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.cv-ovl .cv-q button{background:#3f7e7a}.cv-text{max-height:30vh;overflow:auto;background:#fffaf0;border:2px solid #d8c39c;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:15px;line-height:1.5;text-align:left;color:#24170f;-webkit-overflow-scrolling:touch}.cv-text p{margin:0 0 .6em}.cv-text .cv-pl{display:inline-block;background:#24170f;color:#fffaf0;border-radius:6px;padding:0 6px;margin-right:6px;font-weight:800;font-size:13px}.cv-note{font-size:13px;color:#6b5541;margin:0 0 4px}.cv-ovl{position:fixed;inset:0;z-index:9999;background:#f3e8cf;color:#24170f;display:flex;flex-direction:column;font-family:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.cv-ovl h2{margin:0 0 4px;font-size:22px}.cv-ovl .cv-text{flex:1;max-height:none;font-size:17px}.cv-ovl .cv-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:8px;flex-wrap:wrap}.cv-ovl .cv-count{font-weight:800;font-size:18px}.cv-ovl button{font:inherit;font-weight:800;font-size:18px;padding:12px 22px;border-radius:12px;border:2px solid #24170f;background:#b7432d;color:#fff;cursor:pointer}.cv-ovl button:disabled{background:#d8c39c;color:#6b5541;border-color:#d8c39c}@media (min-width:900px){.cv-ovl{align-items:center}.cv-ovl>*{width:min(100%,900px)}.cv-ovl .cv-text{font-size:21px;line-height:1.6;padding:14px 18px}.cv-ovl h2{font-size:26px}}@media (min-width:860px){.cv-text{font-size:17px}}"; document.head.appendChild(st); },
    setText(paras){ paras=(paras||[]).map(String).filter(Boolean); const same=JSON.stringify(paras)===JSON.stringify(this.paras); this.paras=paras; if(!same) this.hl=new Set(); this.need=this.needFor(); return this; },
    words(p){ return String(this.paras[p]||"").split(/(\s+)/); },
    needFor(){ let c=0; this.paras.forEach(p=>{ const w=String(p).replace(/^\[[A-H]\]\s*/,"").split(/\s+/); w.forEach((t,i)=>{ const prev=i?w[i-1]:"."; if(/\d/.test(t)) c++; else if(/^[A-Z][a-z]+/.test(t)&&!/[.!?]$/.test(prev)) c++; }); }); return Math.max(3,Math.min(5,Math.ceil(c/4))); },
    html(){ this.css(); return this.paras.map((p,pi)=>{ const m=String(p).match(/^\[([A-H])\]\s*/); const body=m?p.slice(m[0].length):p; let wi=0; const inner=body.split(/(\s+)/).map(t=>{ if(!t) return ""; if(/^\s+$/.test(t)) return t; const k=pi+":"+(wi++); return '<span class="cv-w'+(this.hl.has(k)?" hl":"")+'" data-k="'+k+'">'+esc(t)+'</span>'; }).join(""); return "<p>"+(m?'<span class="cv-pl">'+m[1]+'</span>':"")+inner+"</p>"; }).join(""); },
    facts(){ const keys=[...this.hl].map(k=>k.split(":").map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]); let runs=0; for(let i=0;i<keys.length;i++){ const p=keys[i-1]; if(!p||p[0]!==keys[i][0]||keys[i][1]!==p[1]+1) runs++; } return runs; },
    kind(tok,prev,first){ const w=String(tok||"").replace(/^[("'“‘]+|[)"'”’,.;:!?]+$/g,""); if(!w) return ""; if(/\d/.test(w)) return "number"; if(/^(january|february|march|april|may|june|july|august|september|october|november|december|monday|tuesday|wednesday|thursday|friday|saturday|sunday|spring|summer|autumn|winter|khareef|ramadan|eid)$/i.test(w)) return "date"; if(/^(because|since|so|therefore|due|reason|reasons|cause|causes|effect|effects|result|results|why)$/i.test(w)) return "reason"; if(/^[A-Z](-[A-Z])+$/.test(w)) return "name"; if(/^[A-Z][A-Za-z'’-]+$/.test(w)&&!first&&!/[.!?]$/.test(String(prev||""))&&!/^(The|This|That|These|Those|It|They|He|She|We|You|I|In|On|At|For|From|With|And|But|Or|So|If|When|Many|Some|Most|Today|However|Then|Also|Here|There|Now|First|Next|Finally|One|Two|Three)$/.test(w)) return "name"; return ""; },

    refuse(el,word){ el.classList.add("no"); setTimeout(()=>el.classList.remove("no"),600); let t=document.querySelector(".cv-refuse"); if(!t){ t=document.createElement("div"); t.className="cv-refuse"; document.body.appendChild(t); } t.innerHTML='<b>“'+esc(word)+'” is not information.</b> Highlight numbers, names, places, dates, times or reasons (because…).'; t.style.display="block"; clearTimeout(this._rt); this._rt=setTimeout(()=>{ t.style.display="none"; },2600); },
    bind(el,onChange){ el.addEventListener("click",e=>{ const w=e.target.closest(".cv-w"); if(!w) return; e.preventDefault(); const k=w.dataset.k; const on=!this.hl.has(k); if(on) this.hl.add(k); else this.hl.delete(k); document.querySelectorAll('.cv-w[data-k="'+k+'"]').forEach(x=>x.classList.toggle("hl",on)); if(onChange) onChange(this.facts(),this.need); }); },

    readFirst(o){ o=o||{}; this.css(); return new Promise(res=>{ const d=document.createElement("div"); d.className="cv-ovl";
      d.innerHTML='<h2>📖 '+esc(o.title||"Read the text first")+'</h2><p class="cv-note">'+esc(o.hint||"Read it once, slowly. You can tap words to underline them. The text stays with you during the questions.")+'</p><div class="cv-text">'+this.html()+'</div><div class="cv-foot"><span class="cv-count"></span><button type="button">'+esc(o.button||"Start ▶")+'</button></div>';
      const btn=d.querySelector("button"); this.bind(d,()=>{}); btn.onclick=()=>{ d.remove(); res(this.facts()); }; document.body.appendChild(d); }); },
    quiz(d){ const items=[...this.hl].map(k=>Object.assign({k},this.at(k))).filter(x=>x.kind); const pick=a=>a[Math.floor(Math.random()*a.length)]; const shuffle=a=>a.slice().sort(()=>Math.random()-.5); const qs=[];
      if(items.length){ const it=pick(items); const letters=[...new Set(this.paras.map((p,i)=>{ const m=String(p).match(/^\[([A-H])\]/); return m?m[1]:String(i+1); }))]; if(letters.length>=2) qs.push({q:'In which paragraph did you highlight “'+it.word+'”?',opts:letters,a:it.letter}); }
      if(items.length){ const it=pick(items); const pool=[]; this.paras.forEach((p,pi)=>{ const m=String(p).match(/^\[([A-H])\]\s*/); const words=(m?p.slice(m[0].length):p).split(/\s+/); words.forEach((w,wi)=>{ const kd=this.kind(w,wi?words[wi-1]:"",wi===0); const c=String(w).replace(/^[("'“‘]+|[)"'”’,.;:!?]+$/g,""); if(kd&&!this.hl.has(pi+":"+wi)&&c!==it.word) pool.push(c); }); }); const dd=shuffle([...new Set(pool)]).slice(0,3); if(dd.length===3) qs.push({q:"Which of these did you highlight?",opts:shuffle([it.word].concat(dd)),a:it.word}); }
      if(items.length){ const it=pick(items); const names={number:"a number, time or date",name:"a name or a place",date:"a date or time word",reason:"a reason (cause / effect)"}; qs.push({q:'What kind of information is “'+it.word+'”?',opts:Object.values(names),a:names[it.kind]}); }
      this.scan={r:0,n:qs.length}; if(!qs.length) return Promise.resolve(); let i=0; const self=this;
      return new Promise(res=>{ const show=()=>{ const q=qs[i]; d.innerHTML='<h2>🔎 Your highlights — question '+(i+1)+' of '+qs.length+'</h2><p class="cv-note">About the facts you highlighted. Each right answer counts in your score.</p><p style="font-size:20px;font-weight:800;margin:8px 0">'+esc(q.q)+'</p><div class="cv-q">'+q.opts.map(o=>'<button type="button" data-hq="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div><p class="cv-note" style="min-height:22px;font-size:16px"></p>';
        const msg=d.querySelector("p:last-child"); d.querySelectorAll("[data-hq]").forEach(b=>b.onclick=()=>{ const ok=b.dataset.hq===q.a; if(ok) self.scan.r++; msg.textContent=ok?"✅ Correct!":"❌ The answer was "+q.a+"."; d.querySelectorAll("[data-hq]").forEach(x=>x.disabled=true); setTimeout(()=>{ i++; if(i<qs.length) show(); else res(); },900); }); }; show(); }); }
  };
  function fullscreen(){ try{ const el=document.documentElement; const r=el.requestFullscreen?el.requestFullscreen({navigationUI:"hide"}):el.webkitRequestFullscreen?el.webkitRequestFullscreen():null; if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
  window.Caravan = { init, student, questions, report, badge, SKILL_NAMES, reader, fullscreen };
})();
</script>
<script>const GAME="Dhow to Zanzibar";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SESS=Caravan.init({game:GAME});Caravan.badge();
const ST={right:0,total:0,skills:{}};let EX=null,QI=0;
const normA=s=>String(s||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function tally(q,ok){ST.total++;if(ok)ST.right++;const k=q.skill||"r_abc";ST.skills[k]=ST.skills[k]||{id:k,r:0,n:0};ST.skills[k].n++;if(ok)ST.skills[k].r++;}
function isRight(q,v){return q.type==="word"?String(q.a).split(/\s*\/\s*/).some(a=>normA(a)===normA(v)):+v===q.a;}
function rightText(q){return q.type==="word"?q.a:q.o[q.a];}
function nextQ(){return EX&&QI<EX.questions.length?EX.questions[QI++]:null;}
function qLeft(){return EX?EX.questions.length-QI:0;}
/* one question in a card, with the text beside it; resolves true/false */
function askQ(q,o){o=o||{};return new Promise(res=>{const d=document.createElement("div");d.className="qov";let done=false,tm=null;
  const typ=q.type==="tfng"?"True / False / Not Given":q.type==="abc"?"Choose A, B or C":"Write ONE word or a number from the text";
  d.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><span class="lab">'+esc(o.label||"Question")+'</span><span class="hint">'+typ+(o.hint?" · "+esc(o.hint):"")+'</span></div>'+(o.seconds?'<div class="timer"><i></i></div>':'')+'<p class="q">'+esc(q.q).replace(/_{2,}/g,"______")+'</p><div class="ans">'+(q.type==="word"?'<div class="row" style="flex-wrap:nowrap"><input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button class="btn t" data-go>Check</button></div>':q.o.map((x,i)=>'<button class="opt" data-v="'+i+'"><b>'+(q.type==="tfng"?"TFN"[i]:"ABC"[i])+'</b><span>'+esc(x)+'</span></button>').join(""))+'</div><div class="fbx"></div>'+Caravan.reader.box("The text — find the answer here (tap to highlight)")+'</div>';
  document.body.appendChild(d);Caravan.reader.bind(d.querySelector(".cv-text"));
  const finish=(v,late)=>{if(done)return;done=true;clearInterval(tm);const ok=!late&&isRight(q,v);tally(q,ok);d.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.v===q.a)b.classList.add("ok");else if(+b.dataset.v===+v)b.classList.add("no");});const inp=d.querySelector("input");if(inp)inp.disabled=true;const g=d.querySelector("[data-go]");if(g)g.disabled=true;
    d.querySelector(".fbx").innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ Correct! ":late?"⏰ Too late. ":"❌ Not this time. ")+(ok?"":"The answer is <b>"+esc(rightText(q))+"</b>. ")+esc(q.why||"")+'</div><button class="btn p w" data-next>Continue ▶</button>';
    d.querySelector("[data-next]").onclick=()=>{d.remove();res(ok);};d.querySelector(".card").scrollTop=0;};
  d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>finish(b.dataset.v));const inp=d.querySelector("input");if(inp){const go=()=>{if(inp.value.trim())finish(inp.value);};d.querySelector("[data-go]").onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});}
  if(o.seconds){const t0=Date.now(),bar=d.querySelector(".timer i");tm=setInterval(()=>{const l=Math.max(0,1-(Date.now()-t0)/(o.seconds*1000));bar.style.width=(l*100)+"%";if(l<=0)finish(null,true);},200);}});}
function note(html,btn){return new Promise(res=>{const d=document.createElement("div");d.className="qov";d.innerHTML='<div class="card">'+html+'<button class="btn p w" style="margin-top:10px">'+(btn||"Continue ▶")+'</button></div>';document.body.appendChild(d);d.querySelector("button.btn.p.w").onclick=()=>{d.remove();res();};});}
async function loadExam(opts,readTitle){const app=$("#app");if(!SESS){app.innerHTML='<div class="card"><h1>'+esc(GAME)+'</h1><p class="err">Log in on the GE2 Caravan page first, then open this game from the Play tab.</p></div>';throw 0;}
  app.innerHTML='<div class="card"><h1>'+esc(GAME)+'</h1><p class="big">✍️ Claude is writing your text and questions…</p><p class="hint" style="text-align:center">About 30–60 seconds. A new text every time.</p></div>';
  try{EX=await Caravan.questions(opts);}catch(e){app.innerHTML='<div class="card"><h1>'+esc(GAME)+'</h1><p class="err">'+esc((e&&e.msg)||"Claude did not answer. Try again.")+'</p><button class="btn p" onclick="location.reload()">Try again</button></div>';throw e;}
  if(EX.bank){const want=new Set((opts.skills||[]).map(k=>k.replace(/^r_/,"")));EX.questions=EX.questions.filter(q=>want.has(q.type));if(opts.n&&EX.questions.length>opts.n)EX.questions=EX.questions.slice(0,opts.n);}
  if(!EX.questions.length){app.innerHTML='<div class="card"><p class="err">The questions did not pass the answer check. Try again.</p><button class="btn p" onclick="location.reload()">Try again</button></div>';throw 0;}
  QI=0;Caravan.reader.setText(EX.paragraphs);await Caravan.reader.readFirst({title:readTitle||"Read the text first",button:"Start ▶"});}
function finishGame(title,lines,won,badges){Caravan.report({right:ST.right,total:ST.total,skills:Object.values(ST.skills),won:!!won,badges:badges||[]});
  $("#app").innerHTML='<div class="card" style="text-align:center"><p class="big">'+title+'</p>'+lines.map(l=>'<p style="margin:4px 0">'+l+'</p>').join("")+'<p style="margin:8px 0"><b>'+ST.right+' / '+ST.total+'</b> questions right. Your result and XP are saved.</p><div class="row" style="justify-content:center"><button class="btn p" onclick="location.reload()">Play again</button></div><p class="hint">Close this tab to go back to the Caravan.</p></div>';}
document.addEventListener("click",function(e){if(e.target.closest("button")&&!document.fullscreenElement&&!window._fs){window._fs=true;Caravan.fullscreen();}},true);

/* Dhow to Zanzibar — a trading voyage. Markets (questions) buy water, food and morale; storms are timed questions. */
const PORTS=[["Sur","Your dhow is ready in the harbour of Sur. The crew carries dates, dried fish and frankincense on board."],["Salalah","You reach Salalah. Traders bring more frankincense and the crew drinks fresh coconut water."],["Socotra","The island of Socotra appears, with its strange dragon blood trees. The crew needs to rest."],["Mogadishu","In Mogadishu the market is full of cloth and spices. The monsoon wind is getting stronger."],["Mombasa","Mombasa at last! The old town is busy and the harbour master wants to see your logbook."],["Zanzibar","Zanzibar — the island of cloves. The voyage is complete."]];
const D={water:70,food:70,morale:70,cargo:5,days:0,leg:0,storms:0,stormsWon:0};const CAP=(SESS&&(SESS.short||SESS.name))||"Captain";
function bars(){return '<div class="row" style="gap:8px"><span>💧</span><div class="bar"><i style="width:'+Math.max(0,D.water)+'%;background:#3f8f9f"></i></div><span>🍚</span><div class="bar"><i style="width:'+Math.max(0,D.food)+'%;background:#e0b046"></i></div><span>🎶</span><div class="bar"><i style="width:'+Math.max(0,D.morale)+'%;background:#2f6f69"></i></div><span>📦 <b>'+D.cargo+'</b></span><span>📅 <b>'+D.days+'</b></span></div>';}
function route(pos){return '<div class="route">'+PORTS.map((p,i)=>'<span class="'+(i<=D.leg?"on":"")+'"><i>'+(i===Math.floor(pos)&&pos===Math.floor(pos)?"⛵":"●")+'</i>'+p[0]+'</span>').join("")+'</div>';}
function scene(html,btn,sail){return new Promise(res=>{$("#app").innerHTML='<div class="card"><h1>⛵ Dhow to Zanzibar</h1>'+route(sail?-1:D.leg)+bars()+'<div class="story'+(sail?" sea":"")+'">'+html+'</div>'+(btn?'<button class="btn p w" id="nx">'+btn+'</button>':'')+'</div>';if(btn)$("#nx").onclick=()=>res();else setTimeout(res,2600);});}
function menu(){$("#app").innerHTML='<div class="card"><h1>⛵ Dhow to Zanzibar</h1><p class="sub">You are Captain '+esc(CAP)+'. Sail your dhow from Sur to Zanzibar: Sur → Salalah → Socotra → Mogadishu → Mombasa → Zanzibar. In every port you answer questions in the market to buy water, food and music for the crew. At sea, storms are fast questions. Keep the three bars above zero and arrive with your cargo.</p><button class="btn p" id="go">Raise the sail ▶</button><p class="hint">Claude writes a new text every time (this uses 1 of your 12 exams today).</p></div>';$("#go").onclick=start;}
function supply(){return new Promise(res=>{const d=document.createElement("div");d.className="qov";d.innerHTML='<div class="card"><p class="big">🛒 Well done! Choose your supplies</p>'+bars()+'<div class="row" style="margin-top:10px"><button class="btn t" data-k="water">💧 Water +30</button><button class="btn" data-k="food">🍚 Food +30</button><button class="btn" data-k="morale">🎶 Morale +30</button></div></div>';document.body.appendChild(d);d.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{D[b.dataset.k]=Math.min(100,D[b.dataset.k]+30);d.remove();res();});});}
async function start(){try{await loadExam({skills:["r_tfng","r_abc","r_word"],n:15,topic:"the old Omani sea trade by dhow from Sur along the coast of East Africa to Zanzibar",words:"320-420"},"The captain's book — read it before you sail");}catch(e){return;}
  for(D.leg=0;D.leg<5;D.leg++){const p=PORTS[D.leg];await scene('<p class="cap">📍 '+esc(p[0])+'</p><p>'+esc(p[1])+'</p><p>Captain '+esc(CAP)+', the market is open. Answer to buy supplies.</p>',"Go to the market ▶");
    const legsLeft=5-D.leg;const per=Math.max(1,Math.min(2,Math.floor(qLeft()/legsLeft)-1));
    for(let i=0;i<per;i++){const q=nextQ();if(!q)break;const ok=await askQ(q,{label:"🏪 Market in "+p[0]+" · "+(i+1)+" of "+per});if(ok)await supply();else D.morale=Math.max(0,D.morale-8);}
    await scene('<p class="cap">🌊 At sea</p><p class="ship">⛵</p><p>The dhow leaves '+esc(p[0])+' for '+esc(PORTS[D.leg+1][0])+'…</p>',null,true);
    const days=4+Math.floor(Math.random()*4);D.days+=days;D.water-=20+Math.floor(Math.random()*8);D.food-=16+Math.floor(Math.random()*8);D.morale-=10+Math.floor(Math.random()*6);
    const sq=nextQ();if(sq){await scene('<p class="cap">⛈️ Storm!</p><p>Dark clouds, high waves. The crew looks at you, Captain '+esc(CAP)+'. Answer fast to save the cargo!</p>',"Face the storm ▶");const ok=await askQ(sq,{label:"⛈️ Storm · 30 seconds",seconds:30});D.storms++;if(ok)D.stormsWon++;if(ok)D.morale=Math.min(100,D.morale+12);else{D.cargo=Math.max(0,D.cargo-1);const k=["water","food","morale"][Math.floor(Math.random()*3)];D[k]-=12;await scene('<p class="cap">💥 The storm wins this time</p><p>One box of cargo falls into the sea and you lose some '+(k==="morale"?"hope":k)+'.</p>',"Sail on ▶");}}
    for(const k of ["water","food","morale"]){if(D[k]<=0){D.days+=5;D[k]=30;await scene('<p class="cap">⚠️ No '+(k==="morale"?"hope left in the crew":k+" left")+'!</p><p>You stop at a small village for help. 5 days lost.</p>',"Continue ▶");}}}
  D.leg=5;const score=D.cargo*100+Math.round(D.water+D.food+D.morale)-D.days*2+ST.right*50;finishGame("🏝️ Captain of Zanzibar!",[esc(PORTS[5][1]),"Cargo delivered: "+D.cargo+" of 5 boxes · "+D.days+" days at sea · score "+score,"Badge: Captain of Zanzibar"+(D.storms===D.stormsWon&&D.storms>0?" + Steady Hand":"")],D.cargo>=3,["captain_zanzibar"].concat(D.storms===D.stormsWon&&D.storms>0?["steady_hand"]:[]));}
menu();
</script></body></html>
