<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhofari Snake — 3D avatar skins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e6b24c;
    --gold-soft: rgba(230, 178, 76, 0.18);
    --ink: #f4ede0;
    --ink-dim: rgba(244, 237, 224, 0.66);
    --panel: rgba(20, 19, 40, 0.62);
    --line: rgba(255, 255, 255, 0.12);
    --display: 'Baloo Bhaijaan 2', 'Trebuchet MS', system-ui, sans-serif;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 80% at 50% 0%, #2c2856 0%, #17163a 46%, #0b0b1c 100%);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  body.game { background: #1a2130; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  header::before {
    content: ''; position: absolute; inset: 0 0 -60px 0; z-index: -1; pointer-events: none;
    background: linear-gradient(rgba(12,9,22,0.62), rgba(12,9,22,0.35) 60%, rgba(12,9,22,0));
  }
  footer::before {
    content: ''; position: absolute; inset: -80px 0 0 0; z-index: -1; pointer-events: none;
    background: linear-gradient(rgba(12,9,22,0), rgba(12,9,22,0.55));
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 20px 26px; pointer-events: none;
  }
  .brand { pointer-events: auto; }
  .kicker {
    font: 600 11px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 8px;
  }
  h1 {
    margin: 0; font: 800 34px/1 var(--display); letter-spacing: 0.01em;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 .ar { font-weight: 700; font-size: 28px; color: var(--ink-dim); direction: rtl; }
  .sub { margin-top: 6px; font-size: 13px; color: var(--ink-dim); max-width: 380px; line-height: 1.45; }

  .seg {
    pointer-events: auto; display: inline-flex; padding: 4px; gap: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .seg button {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px;
    padding: 9px 16px; font: 700 14px/1 var(--display); color: var(--ink-dim); background: transparent;
  }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #1d1606; }
  .seg button:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 0 20px 20px; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none;
  }
  .hint {
    pointer-events: none; font-size: 12.5px; color: var(--ink-dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .cards { display: flex; gap: 10px; pointer-events: auto; max-width: 100%; overflow-x: auto; padding: 4px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card {
    appearance: none; text-align: left; cursor: pointer; color: var(--ink);
    flex: 0 0 auto; width: 262px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px 14px; align-items: center;
    padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: border-color .2s, transform .2s, background .2s;
  }
  .card:hover { transform: translateY(-2px); }
  .card[aria-pressed="true"] { border-color: var(--gold); background: rgba(40, 33, 30, 0.72); box-shadow: 0 0 0 1px var(--gold), 0 10px 30px rgba(0,0,0,.35); }
  .thumb {
    grid-row: span 2; width: 48px; height: 48px; border-radius: 50%;
    background-size: 260% auto; background-position: 30% 50%;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25), 0 4px 12px rgba(0,0,0,.35);
  }
  .card .row { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
  .card .num { font: 700 12px/1 var(--display); color: var(--gold); }
  .card .name { font: 800 16px/1.05 var(--display); white-space: nowrap; }
  .card .ar { font: 700 14px/1 var(--display); color: var(--ink-dim); margin-left: auto; direction: rtl; white-space: nowrap; }
  .card .blurb { font-size: 11.5px; line-height: 1.4; color: var(--ink-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card[aria-pressed="true"] .blurb { -webkit-line-clamp: 4; }
  .all { appearance: none; pointer-events: auto; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: 700 13px/1 var(--display); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .all[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .toprow { display: flex; gap: 10px; align-items: center; pointer-events: auto; }

  .labels { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center;
    font: 800 15px/1 var(--display); color: var(--ink); text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 2px 12px rgba(0,0,0,.7);
    transition: opacity .3s;
  }
  .tag small { display: block; font: 700 13px/1.3 var(--display); color: var(--gold); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 18px var(--display); color: var(--ink-dim); }

  @media (max-width: 760px) {
    header { padding: 14px 14px; flex-direction: column; gap: 10px; }
    h1 { font-size: 26px; gap: 10px; }
    h1 .ar { font-size: 22px; }
    .sub { display: none; }
    footer { padding: 0 0 12px; }
    .cards { width: 100%; padding: 4px 12px; scroll-snap-type: x mandatory; }
    .card { width: 78vw; max-width: 300px; scroll-snap-align: center; }
    .tag { font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D view of the Dhofari snake skins"></canvas>
<div class="labels" id="labels"></div>
<div id="loading">Loading the skins…</div>
<header>
  <div class="brand">
    <div class="kicker">GE2 Caravan · Wadi Snakes · skin gallery</div>
    <h1>Dhofari Snake <span class="ar">الثعبان الظفاري</span></h1>
    <div class="sub">Omani masar, Dhofar's khareef, Jabal Akhdar roses, and halwa with qahwa, worn as snake skins. Unlock them with XP in Wadi Snakes, then pick yours in the game lobby.</div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button type="button" id="modeShow" aria-pressed="true">Showcase</button>
    <button type="button" id="modeGame" aria-pressed="false">In-game</button>
  </div>
</header>
<footer>
  <div class="toprow">
    <button type="button" class="all" id="allBtn" aria-pressed="true">All five</button>
    <div class="hint" id="hint">Pick a skin to look closer</div>
  </div>
  <div class="cards" id="cards"></div>
</footer>
